[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "logmind"
version = "0.1.0"
description = "Reproducible, read-only Kubernetes incident diagnosis experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1"]

[project.optional-dependencies]
model = ["torch==2.7.1+cu128", "transformers==4.57.6", "psutil>=7,<8"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[project.scripts]
logmind = "logmind.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data/frozen", "experiments/reports/phase0"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
