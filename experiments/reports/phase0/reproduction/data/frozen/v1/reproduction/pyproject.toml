[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "logmind"
version = "0.1.0"
description = "Reproducible, read-only Kubernetes incident diagnosis experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1"]

[project.scripts]
logmind = "logmind.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data/frozen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
